name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # live kDrive tests skip without credentials
      - run: npm run build
      # Also guards that nothing on the headless path imports obsidian/electron:
      # esbuild.cli.config.mjs turns such an import into a build error.
      - run: node esbuild.cli.config.mjs production
